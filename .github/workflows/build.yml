name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-apk
          path: app/build/outputs/apk/release/ghost-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: app/build/outputs/screens
          if-no-files-found: ignore
      # Publishes the APK as a release so it can be downloaded straight to the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Ghost 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/ghost-release.apk
